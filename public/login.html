<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xolven.Si — Sign in</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-screen">
  <form id="login-form" class="login-card">
    <img class="login-mark" src="assets/icon-navy.png" alt="Xolven.Si">
    <h1 class="login-title">Sign in to Xolven.Si</h1>
    <p class="login-sub">Client memory for your WhatsApp Business account</p>

    <label class="field-label" for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username" placeholder="you@company.com">

    <label class="field-label" for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">

    <div id="login-error" class="login-error" hidden></div>

    <button type="submit" class="btn-primary login-submit">Sign in</button>
  </form>
</div>
<script src="login.js"></script>
</body>
</html>
